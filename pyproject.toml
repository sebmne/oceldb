[project]
name = "oceldb"
version = "0.9.1"
description = "Polars-backed OCEL 2.0 event log access with lazy queries"
authors = [{name = "Sebastian Menne", email = "sebastian.menne@rwth-aachen.de"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.1",
    "ijson>=3.4.0",
    "polars>=1.35.2",
    "pyarrow>=24.0.0",
    "pyarrow-hotfix>=0.7",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.pytest_cache",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/test.custom",
]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/docs",
    "/pyproject.toml",
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oceldb"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src"]
exclude = ["tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Polars intentionally accepts broad expression inputs, which surface as
# Unknown in its public annotations under strict mode. Keep strict checking for
# concrete types while suppressing those third-party boundary diagnostics.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
# Package-private helpers are shared between the small filter modules.
reportPrivateUsage = false
reportUnusedFunction = false
